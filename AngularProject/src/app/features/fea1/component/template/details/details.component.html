<form #userForm="ngForm" (ngSubmit)="onSubmit()">

  <div class="row">
    <div class="col-6">
      <MK-label name="name">Name:</MK-label>
      <MK-textbox id="name" name="name" type="text" [(value)]="temp.name" [required]="true">
      </MK-textbox>
    </div>
    <div class="col-6">
      <MK-label name="logo">logo:</MK-label>
      <MK-textbox id="logo" name="logo" type="text" [(value)]="temp.logo" [required]="true">
      </MK-textbox>
    </div>
    <div class="col-6">
      <MK-label name="isPublished">isPublished:</MK-label>
      <MK-checkbox name="all" [(checked)]="temp.isPublished">
        {{ 'isPublished' | translate }}
      </MK-checkbox>
    </div>
    <div class="col-6">
      <MK-label name="slug">slug:</MK-label>
      <MK-textbox id="slug" name="slug" type="text" [(value)]="temp.slug" [required]="true">
      </MK-textbox>
    </div>
    <div class="col-6">
      <MK-label name="slug">file:</MK-label>
      <MK-button type="button" (onClick)="download(temp.logo)">
        {{ 'download' | translate }}
      </MK-button>
    </div>

  </div>
  <MK-button type="submit" [disabled]="userForm.invalid">
    <!--(click)="signin()"-->
    {{ 'SHD_SIGN_IN' | translate }}
  </MK-button>
</form>
{{userForm.valid}}
{{temp | json}}
