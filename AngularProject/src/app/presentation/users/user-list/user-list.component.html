<div class="row">
   <div class="col-6">
      <p-toggleButton [(ngModel)]="checked" onLabel="On" offLabel="Off" />

   </div>
   <div class="col-6">
      <div class="card flex justify-content-center">
         <p-multiSelect [options]="cities" [(ngModel)]="selectedCities" optionLabel="name"
            placeholder="Select Cities" />
      </div>
   </div>
</div>
<div class="row">
   <div class="col-6">
      <p-calendar [(ngModel)]="date" [showIcon]="true" [showOnFocus]="false" inputId="buttondisplay" />


   </div>
   <div class="col-6">
      <div class="card flex justify-content-center">
         <p-multiSelect [options]="cities" [(ngModel)]="selectedCities" optionLabel="name"
            placeholder="Select Cities" />
      </div>
   </div>
</div>

<form #fpForm="ngForm">
   <div class="row">
      <div class="col-6">
         <label class="form-label" for="exampleInputEmail1">Email address</label>
         <ui-textbox name="someValue" [id]="'id1'" [name]="'name1'" [(ngModel)]="dataModel">
         </ui-textbox>
      </div>

      <div class="col-6">
         <label class="form-label" for="exampleInputEmail1">Email address</label>
         <ui-textbox name="someValue" [id]="'id2'" [name]="'name2'" [(ngModel)]="dataModel" #name2="ngModel">
         </ui-textbox>
         <validation-messages [formCtrl]="name2"></validation-messages>
      </div>

      <div class="col-lg-6 col-md-6  form-group">
         <label for="organizationName" class="col-form-label">{{ "label.organizationName" | translate }} </label>
         <div>
            <input type="text" class="form-control" name="organizationName" [id]="organizationName" [required]="true"
               [(ngModel)]="dataModel" maxlength="150" #organizationName="ngModel" />
            <validation-messages [formCtrl]="organizationName"></validation-messages>
         </div>
      </div>
   </div>
</form>
